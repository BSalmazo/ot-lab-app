site_name: Liscere engine
site_url: https://liscere.com/OT-Lab/
repo_url: https://github.com/LiscereSecurity/OT-Lab
repo_name: LiscereSecurity/OT-Lab
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  features: [navigation.sections, navigation.top, content.code.copy, search.suggest]
  palette:
    - scheme: default
      primary: blue grey
      toggle: { icon: material/brightness-7, name: Dark mode }
    - scheme: slate
      primary: blue grey
      toggle: { icon: material/brightness-4, name: Light mode }

markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.snippets: { base_path: ["."], check_paths: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Start here: index.md
  - Architecture: architecture.md
  - Run record and events: run-record.md
  - Replay and recording: replay.md
  - Learning, resume and stabilisation: learning.md
  - Scenarios and metrics: metrics.md
  - Configuration: config.md
  - Bench: bench.md
  - Raspberry Pi runbook: pi.md
  - Experiments: experiments.md
  - Tests and contributing: contributing.md
  - Decisions: decisions.md
  - Changelog: changelog.md
