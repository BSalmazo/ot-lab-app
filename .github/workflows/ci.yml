name: CI

# Runs on every push to every branch and on every pull request, so no commit reaches the
# repository unverified. The environment comes from uv.lock; tests run through pytest, whose
# tests/test_scripts.py wrapper executes every script-style test file under tests/.

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install from the lockfile (engine, UI extra, dev tools)
        run: uv sync --locked --extra ui --group dev --group docs

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy, non-blocking until the baseline is at zero)
        run: uv run mypy
        continue-on-error: true

      - name: Python syntax check
        run: uv run python -m compileall -q otlab_core liscere scripts tests

      - name: Tests
        run: uv run pytest

      - name: Console scripts are installed
        run: |
          uv run liscere-observe --version
          uv run liscere-probe --version
          uv run liscere-ui --version

      - name: Build the wheel
        run: uv build

      - name: Build the docs (strict)
        run: uv run mkdocs build --strict
