name: CI

on:
  push:
    branches:
      - main
      - master
      - v2-dev
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax check
        run: python -m compileall -q otlab_core scripts tests

      - name: Unit tests
        run: |
          python tests/test_autocalibrate.py
          python tests/test_discover.py
          python tests/test_observer_pipeline.py
          python tests/test_modbus_parity.py
