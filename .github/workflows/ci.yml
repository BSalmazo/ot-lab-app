name: CI

# Runs on every push to every branch and on every pull request, so no commit reaches the
# repository unverified. Every test file under tests/ is executed as the standalone script it is
# (each prints PASS/FAIL per check and exits non-zero on any failure). The loop runs all files
# and fails at the end, so one failing file never hides another.

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the optional UI dependency (rich), needed by the UI tests
        run: python -m pip install --quiet -r requirements.txt

      - name: Python syntax check
        run: python -m compileall -q otlab_core scripts tests

      - name: Run every test script under tests/
        run: |
          status=0
          for t in tests/test_*.py; do
            echo "::group::$t"
            if python "$t"; then
              echo "RESULT $t: pass"
            else
              echo "RESULT $t: FAIL"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
