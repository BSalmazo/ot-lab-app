# Categories for GitHub's generated release notes, by pull request label.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Maintenance
      labels: [chore]
    - title: Other changes
      labels: ["*"]
