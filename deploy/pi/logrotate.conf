# Run records grow for as long as a run lasts (a continuous evaluate can run for weeks).
# Only events.jsonl is rotated: it is reproducible from capture/ by replay, so truncating it loses
# nothing. capture/*.tsv is the replayable input and verdicts.jsonl the evidence; neither is
# rotated here. Disk use of capture/ is bounded by the operator (see README: pruning old runs).
/var/lib/liscere/runs/*/events.jsonl {
    size 50M
    rotate 5
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
