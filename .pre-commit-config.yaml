# Install once with `uv run pre-commit install`. Runs on staged files at every commit.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=6000"]   # the trimmed reference capture in tests/data may approach 5 MB
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
  - repo: local
    hooks:
      - id: no-em-dash
        name: no em dash in code, comments or docs
        description: The project writes British English without em dashes; use a comma, colon or full stop.
        entry: bash -c 'if grep -nP "\x{2014}" "$@"; then echo "em dash found (see lines above)"; exit 1; fi' --
        language: system
        types_or: [python, markdown, yaml, toml]
